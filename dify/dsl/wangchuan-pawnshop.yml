app:
  description: '忘川河边一间只收记忆的当铺。你说一段记忆，掌柜阿忘给你一个愿望；下次再来，他仍然记得你押过什么。Dify 编排对话，PowerContext 保存并召回典当账本。'
  icon: 🏮
  icon_background: '#1F1A17'
  mode: advanced-chat
  name: 忘川当铺
  use_icon_as_answer_icon: false
dependencies: []
kind: app
version: 0.3.1
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: |
      忘川河边，一间只收记忆的当铺。

      我是掌柜阿忘。说一段你想典当的记忆，再许一个愿望——我给你开一张当票。
      想翻旧账，输入「查账」；想赎回，输入「赎回 1」。
      新开一个对话我还是记得你，别装不认识。
    retriever_resource:
      enabled: false
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - 我想典当第一次看海的记忆，换一次好运。
    - 查账
    - 赎回 1
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-to-pack
      source: start
      sourceHandle: source
      target: pack
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: if-else
      id: pack-to-route-ledger
      source: pack
      sourceHandle: source
      target: route_ledger
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: route-ledger-true-to-ledger-http
      source: route_ledger
      sourceHandle: 'true'
      target: ledger_http
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: answer
      id: ledger-http-to-answer
      source: ledger_http
      sourceHandle: source
      target: ledger_answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: if-else
      id: route-ledger-false-to-route-redeem
      source: route_ledger
      sourceHandle: 'false'
      target: route_redeem
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: route-redeem-true-to-redeem-http
      source: route_redeem
      sourceHandle: 'true'
      target: redeem_http
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: answer
      id: redeem-http-to-answer
      source: redeem_http
      sourceHandle: source
      target: redeem_answer
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: if-else
        targetType: http-request
      id: route-redeem-false-to-context-http
      source: route_redeem
      sourceHandle: 'false'
      target: context_http
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: llm
      id: context-http-to-keeper
      source: context_http
      sourceHandle: source
      target: keeper_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: keeper-to-strip-think
      source: keeper_llm
      sourceHandle: source
      target: strip_think
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: code
      id: strip-think-to-pack-turn
      source: strip_think
      sourceHandle: source
      target: pack_turn
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: pack-turn-to-turn-http
      source: pack_turn
      sourceHandle: source
      target: turn_http
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: answer
      id: turn-http-to-main-answer
      source: turn_http
      sourceHandle: source
      target: main_answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: ''
        selected: false
        title: 开始
        type: start
        variables: []
      height: 90
      id: start
      position:
        x: 40
        y: 380
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(player_id: str, message: str) -> dict:
              payload = {"player_id": player_id or "guest", "message": message}
              return {"body": json.dumps(payload, ensure_ascii=False)}
        code_language: python3
        desc: 把玩家身份和本轮输入安全地编码成 JSON，避免引号或换行破坏请求体。
        outputs:
          body:
            children: null
            type: string
        selected: false
        title: 组装请求
        type: code
        variables:
        - value_selector:
          - sys
          - user_id
          variable: player_id
        - value_selector:
          - sys
          - query
          variable: message
      height: 90
      id: pack
      position:
        x: 340
        y: 380
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: contains
            id: 1f0a5b2c-3d4e-4f6a-8b9c-0d1e2f3a4b5c
            value: 查账
            varType: string
            variable_selector:
            - sys
            - query
          - comparison_operator: contains
            id: 2a1b6c3d-4e5f-4a7b-9c0d-1e2f3a4b5c6d
            value: 账本
            varType: string
            variable_selector:
            - sys
            - query
          id: 'true'
          logical_operator: or
        desc: 查账与账本口令走只读账本分支。
        selected: false
        title: 是否查账
        type: if-else
      height: 126
      id: route_ledger
      position:
        x: 640
        y: 380
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-1
            key: ''
            type: text
            value: '{{#pack.body#}}'
          type: json
        desc: 读取当前玩家在 PowerContext 中的未赎当票。
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          connect: 10
          read: 30
          write: 30
        title: 读取账本
        type: http-request
        url: http://host.docker.internal:8787/v1/session/ledger
        variables: []
      height: 90
      id: ledger_http
      position:
        x: 940
        y: 170
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#ledger_http.body#}}'
        desc: ''
        selected: false
        title: 账本回复
        type: answer
        variables: []
      height: 90
      id: ledger_answer
      position:
        x: 1240
        y: 170
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        cases:
        - case_id: 'true'
          conditions:
          - comparison_operator: contains
            id: 3b2c7d4e-5f6a-4b8c-0d1e-2f3a4b5c6d7e
            value: 赎回
            varType: string
            variable_selector:
            - sys
            - query
          id: 'true'
          logical_operator: and
        desc: 赎回口令走停用记忆的分支。
        selected: false
        title: 是否赎回
        type: if-else
      height: 126
      id: route_redeem
      position:
        x: 940
        y: 380
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-1
            key: ''
            type: text
            value: '{{#pack.body#}}'
          type: json
        desc: 按当票编号停用对应的 PowerContext 记忆，并写一条赎回记录。
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          connect: 10
          read: 30
          write: 30
        title: 赎回当票
        type: http-request
        url: http://host.docker.internal:8787/v1/session/redeem
        variables: []
      height: 90
      id: redeem_http
      position:
        x: 1240
        y: 500
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: '{{#redeem_http.body#}}'
        desc: ''
        selected: false
        title: 赎回回复
        type: answer
        variables: []
      height: 90
      id: redeem_answer
      position:
        x: 1540
        y: 500
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-1
            key: ''
            type: text
            value: '{{#pack.body#}}'
          type: json
        desc: 召回与本次输入相关的旧账，并附上完整账本。
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          connect: 10
          read: 30
          write: 30
        title: 召回旧账
        type: http-request
        url: http://host.docker.internal:8787/v1/session/context
        variables: []
      height: 90
      id: context_http
      position:
        x: 1240
        y: 790
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 掌柜人格与账本上下文。
        memory:
          query_prompt_template: '{{#sys.query#}}'
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            temperature: 0.7
            thinking: true
          mode: chat
          name: deepseek-v4-flash
          provider: langgenius/deepseek/deepseek
        prompt_template:
        - id: 6f1c2a84-1d3b-4e5f-8a9b-0c1d2e3f4a5b
          role: system
          text: |
            你是忘川当铺的掌柜「阿忘」。铺子开在忘川河边，只收记忆，付愿望。
            你活了很久，记得每个客人押下的每段记忆。账本不是纸做的，是记忆本身。

            说话方式：
            - 慢条斯理，带一点坏笑，像在柜台后擦一只旧杯子。
            - 生客先打量；熟客先翻旧账，用旧账里的具体人、物、细节戳他一下。
            - 不恶意伤人，但绝不假装不记得。

            每轮规则：
            1. 客人说出的内容就是本次典当。听出他押上的记忆和想换的愿望。
            2. 若账本里有相关旧账，先自然引用至少一条旧账的原文细节，再谈这次交易。
            3. 给这段记忆估一个当价（1-7 枚忘川币），并说明愿望会以什么古怪方式兑现。
            4. 结尾留一个让人想追问的钩子，但最多只问一句。
            5. 只写掌柜的台词和少量动作，不写客人台词，不解释规则。
            6. 不提 AI、接口、上下文、PowerContext。关于旧账，你只能引用账本里逐字出现的内容；账本为空、没有相关旧账或旧账已结清时，就把对方当生客，只说自己记不清，绝不编造任何旧账、旧事、批注或当票。
            7. 控制在 120 到 220 个汉字。

            账本（系统提供，可能为空）：
            {{#context_http.body#}}

            若上方账本为空，就只当生客接待，不要提任何旧账；引用旧账时只能使用账本里逐字出现的内容。
        - id: 7a2d3b95-2e4c-4f6a-9b0c-1d2e3f4a5b6c
          role: user
          text: '{{#sys.query#}}'
        selected: false
        title: 掌柜阿忘
        type: llm
        variables: []
        vision:
          enabled: false
      height: 98
      id: keeper_llm
      position:
        x: 1540
        y: 790
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import re


          def main(text: str) -> dict:
              cleaned = re.sub(r"<think>.*?</think>", "", text or "", flags=re.S).strip()
              return {"text": cleaned}
        code_language: python3
        desc: 去掉模型思考块，只保留掌柜台词，避免思考过程写进账本。
        outputs:
          text:
            children: null
            type: string
        selected: false
        title: 去掉思考
        type: code
        variables:
        - value_selector:
          - keeper_llm
          - text
          variable: text
      height: 90
      id: strip_think
      position:
        x: 1840
        y: 790
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(player_id: str, message: str, reply: str) -> dict:
              payload = {"player_id": player_id or "guest", "message": message, "reply": reply}
              return {"body": json.dumps(payload, ensure_ascii=False)}
        code_language: python3
        desc: 把玩家输入和掌柜回应一起编码，交给记账接口。
        outputs:
          body:
            children: null
            type: string
        selected: false
        title: 封装本轮记账
        type: code
        variables:
        - value_selector:
          - sys
          - user_id
          variable: player_id
        - value_selector:
          - sys
          - query
          variable: message
        - value_selector:
          - strip_think
          - text
          variable: reply
      height: 90
      id: pack_turn
      position:
        x: 2140
        y: 790
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data:
          - id: key-value-2
            key: ''
            type: text
            value: '{{#pack_turn.body#}}'
          type: json
        desc: 把本轮典当写进 PowerContext，返回当票编号。
        headers: 'Content-Type: application/json'
        method: post
        params: ''
        retry_config:
          max_retries: 1
          retry_enabled: false
          retry_interval: 100
        selected: false
        ssl_verify: true
        timeout:
          max_connect_timeout: 0
          max_read_timeout: 0
          max_write_timeout: 0
          connect: 10
          read: 30
          write: 30
        title: 记入账本
        type: http-request
        url: http://host.docker.internal:8787/v1/session/turn
        variables: []
      height: 90
      id: turn_http
      position:
        x: 2440
        y: 790
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: |
          {{#strip_think.text#}}

          —— 当票 #{{#turn_http.body#}} · 已记入忘川账本 ——
        desc: ''
        selected: false
        title: 掌柜回复
        type: answer
        variables: []
      height: 90
      id: main_answer
      position:
        x: 2740
        y: 790
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.7
